# Backend tooling config. Runtime deps live in requirements.txt; dev/CI-only
# tooling lives in requirements-dev.txt.

[tool.ruff]
# Match the production runtime (backend/Dockerfile: python:3.11-slim).
target-version = "py311"
line-length = 100
# Migrations are largely Alembic-generated and follow their own conventions —
# don't lint them.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# Deliberately narrow: catch *real* problems — undefined names, unused/dead
# imports, f-strings without placeholders, syntax errors — NOT style. This keeps
# the deploy gate low-noise so a red check always means a genuine problem worth
# stopping a deploy for. See docs/adr/ADR-013-deploy-gated-ci.md.
#
# S110/E722 are here for one specific reason: `except: pass` hid the fact that ML
# scoring raised on *every* dataset for months (2026-08-07). A swallowed exception
# is invisible by construction — it produces no log line, no metric, no symptom, so
# nothing can ever alert on it. Swallowing is sometimes right (best-effort S3
# cleanup), but it must be a deliberate, reviewed choice: log the exception, or add
# an explicit `# noqa: S110` saying why silence is correct here.
select = ["F", "E9", "S110", "E722"]

[tool.pytest.ini_options]
# asyncio_mode=auto runs async tests/fixtures without a per-test marker.
# Function-scoped loops keep each test isolated (we use NullPool, so connections
# are never shared across loops).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
