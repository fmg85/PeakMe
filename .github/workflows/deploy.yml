name: Deploy to EC2

on:
  push:
    branches: [main]
  # Run the checks on PRs too (for the rare branch-and-PR flow); the deploy job
  # below is guarded so PRs never deploy.
  pull_request:
    branches: [main]
  # Nightly catch-up: re-deploys if EC2 fell behind while push-triggered deploys
  # were failing (e.g. during an EC2 reboot window). Runs at 03:00 UTC daily.
  schedule:
    - cron: '0 3 * * *'
  # Manual trigger from GitHub Actions UI — use this to redeploy without a dummy commit.
  workflow_dispatch:

# NOTE: app.config.Settings() requires several env vars just to *import* the app.
# The checks below set throwaway values for them — none point at real
# infrastructure and no repository secrets are used in the check jobs.
jobs:
  # ── Gate 1: backend boots and is free of real lint errors ──────────────────
  backend-checks:
    name: Backend lint + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (undefined names, dead imports, syntax — not style)
        working-directory: backend
        run: ruff check app
      - name: Import smoke (app boots / no import-time errors)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://u:p@localhost:5432/db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_JWT_SECRET: ci-dummy
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy
          AWS_S3_BUCKET: ci-dummy
        run: python -c "import app.main; print('app imports OK')"

  # ── Gate 2: migrations apply cleanly from scratch on a real Postgres ───────
  # This is the single highest-value gate: it stops a broken migration before it
  # ever reaches the production database (deploy runs `alembic upgrade head`
  # directly against prod).
  migration-check:
    name: Migrations apply on a clean DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_SECRET: ci-dummy
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_S3_BUCKET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: alembic upgrade head (from an empty database)
        working-directory: backend
        run: alembic upgrade head
      - name: alembic check (model/migration drift — advisory, never blocks)
        working-directory: backend
        continue-on-error: true
        run: alembic check

  # ── Gate 3: the scary backend paths actually behave ────────────────────────
  # auth (JWT verification + account-merge), the annotate upsert, the queue
  # cursor, and the ownership 403 — the boundaries where a silent regression
  # corrupts data or exposes another user's projects.
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_SECRET: ci-dummy
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_S3_BUCKET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  # ── Frontend lint + type-check ─────────────────────────────────────────────
  # Fast PR-time feedback. NOTE: this does NOT gate the backend deploy below — the
  # frontend ships via Vercel, not this workflow. The frontend's real deploy gate
  # is its build (`npm run build` runs `tsc && eslint .` before `vite build`), so
  # Vercel refuses to ship type errors or lint errors. A frontend problem must not
  # block a backend deploy (and vice versa).
  frontend-checks:
    name: Frontend lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit
      - name: Lint (eslint — bug-focused flat config)
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (vitest — offline-sync suite)
        working-directory: frontend
        run: npm test

  # ── R scripts parse ────────────────────────────────────────────────────────
  # The R scripts are researcher-facing assets (copied into frontend/public and
  # served by Vercel). A syntax error would ship with nothing else to catch it.
  # We parse each script as-is AND with every `\` rewritten to `/` — a defensive
  # guard for the historical "Vite rewrites backslashes" footgun. (Verified
  # 2026-06-14 that no such rewrite currently happens — the deployed scripts are
  # byte-identical to source — but the check is cheap insurance.)
  # Reporting only: does NOT gate the backend deploy (R scripts ship via Vercel).
  r-lint:
    name: R scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse each R script (as-is and as-served)
        run: |
          set -e
          for f in r-scripts/*.R; do
            Rscript -e "invisible(parse('$f')); cat('parsed:', '$f', '\n')"
            served="/tmp/$(basename "$f")"
            sed 's/\\/\//g' "$f" > "$served"
            Rscript -e "invisible(parse('$served')); cat('parsed as-served:', '$f', '\n')"
          done

  # ── Deploy (gated) ─────────────────────────────────────────────────────────
  # Only runs if the backend checks pass. A red check skips the deploy and leaves
  # prod on the last good commit. PRs run the checks but never deploy.
  deploy:
    name: Deploy to EC2
    needs: [backend-checks, migration-check, backend-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          retry_count: 3
          connect_timeout: 30s
          script: |
            set -e
            cd ~/PeakMe
            # Deep readiness gate: process booted AND DB reachable AND schema migrated
            # to the revision the new code expects. Retries to allow the container to
            # come up (and a slow Supabase free-tier wakeup). Replaces the old static
            # /health curl, which passed even with a broken DB or unmigrated schema.
            check_ready() {
              for i in 1 2 3 4 5 6; do
                if curl -sf --max-time 15 http://localhost:8000/readiness; then return 0; fi
                echo "not ready yet (attempt $i)..."; sleep 5
              done
              echo "Readiness check failed -- DB unreachable or schema not at head"; return 1
            }
            git fetch origin main
            BEHIND=$(git rev-list HEAD..origin/main --count)
            if [ "$BEHIND" -gt 0 ]; then
              echo "EC2 is $BEHIND commit(s) behind — deploying..."
              git pull origin main
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
              docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api alembic upgrade head
              docker image prune -f
              check_ready  # fatal — we just deployed; must be serving healthily
            else
              echo "EC2 is up to date ($(git rev-parse --short HEAD)) — skipping rebuild"
              # No deploy happened. Readiness also pings the DB (SELECT 1), doubling as
              # the Supabase keepalive. Non-fatal here so a slow free-tier wakeup doesn't
              # fail the nightly catch-up run.
              check_ready || echo "readiness slow or failed (non-fatal on a no-deploy run)"
            fi
